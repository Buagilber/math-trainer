<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f6df5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="Безкоштовний тренажер математичних прикладів за програмою НУШ: обери клас і тему — і одразу розв'язуй. Щоразу нові приклади, зірки й статистика.">
  <meta property="og:title" content="Математика без підручника">
  <meta property="og:description" content="Тренажер прикладів за програмою НУШ. Обери клас і тему — і одразу розв'язуй.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="assets/icon-512.png">
  <title>Математика</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app"></div>
  <noscript>Для роботи застосунку потрібен JavaScript.</noscript>
  <script>
    // Запобіжник: якщо модулі не завантажились (наприклад, одразу після оновлення
    // браузер змішав старі файли з кешу з новими), показуємо зрозуміле повідомлення
    // замість порожнього екрана. GitHub Pages кешує файли до 10 хвилин.
    setTimeout(function () {
      var app = document.getElementById('app');
      if (app.childElementCount) return;
      app.innerHTML = '<div class="center"><p>Застосунок щойно оновився і ще завантажується.</p>'
        + '<p class="muted">Спробуйте оновити сторінку за кілька хвилин.</p>'
        + '<button class="btn" onclick="location.reload()">Оновити</button></div>';
    }, 5000);
  </script>
  <script type="module" src="js/app/main.js"></script>
</body>
</html>
